name: Build BlockRadio Paper

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: ./BlockRadio-Paper-source/BlockRadioPaper
        run: gradle clean build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockRadio-Paper
          path: BlockRadio-Paper-source/BlockRadioPaper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
