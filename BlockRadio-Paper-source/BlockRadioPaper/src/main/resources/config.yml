# Les textes utilisent le format MiniMessage : https://docs.advntr.dev/minimessage/format.html
messages:
  mod-required: "<red>Le mod BlockRadio est requis pour utiliser cette commande."
  player-only: "Cette commande est réservée aux joueurs."

bossbar:
  enabled: true
  # Placeholder disponible : <title>
