menu:
  title: "<dark_gray>Radio BlockRadio"
  play: "<green>Lecture"
  stop: "<red>Arrêt"
  volume-up: "<yellow>Volume +"
  volume-down: "<yellow>Volume -"
  info-name: "<gold>Radio"
  info-playing: "<gray>État : <green>en lecture"
  info-stopped: "<gray>État : <red>arrêtée"
  info-title: "<gray>Titre : <white><title>"
  info-volume: "<gray>Volume : <white><volume>%"
